# Keyless generic ACP v1 control-surface patch over `infinity --profile acp`.

- id: llm-deepseek
  name: '@infinity-agent/llm-deepseek-api-key'
  disabled: true

- id: acp
  name: '@infinity-agent/acp'
  config:
    provider: control-fixture
    model: alpha

- id: session-persistence-jsonl
  name: '@infinity-agent/session-persistence-jsonl'
  config:
    root: !!js process.env.INFINITY_CONFORMANCE_PERSISTENCE_ROOT
    compression: none

- insert:
    - id: control-surface-llm
      name: './control-surface-llm.ts'
