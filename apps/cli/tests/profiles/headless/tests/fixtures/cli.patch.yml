# Keyless model and isolated-path patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: cli-mock
        model: cli-mock
        cwd: !!js process.cwd()

- id: shell-env
  config:
    dshHome: './.infinity-agent-home'

- id: agent-instructions
  disabled: true

- id: skill-filesystem
  config:
    dshHome: './.infinity-agent-home'
    agentsHome: './.agents-home'

- id: session-persistence-jsonl
  config:
    root: './.sessions'

- insert:
    - id: cli-mock-llm
      name: '../../../../../../../packages/test-support/loader-smoke/tests/fixtures/cli-mock-llm.ts'

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.INFINITY_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()

# Own key references no runner sets on the DeepSeek Search and Fetch APIs: the
# turn runs as a deployment without web search credentials, whatever
# DEEPSEEK_API_KEY the launching environment exports.
- id: web-deepseek-api
  config:
    searchApiKeyEnv: INFINITY_KEYLESS_SMOKE_SEARCH_KEY
    fetchApiKeyEnv: INFINITY_KEYLESS_SMOKE_FETCH_KEY

- id: web-search-deepseek
  config:
    apiKeyEnv: INFINITY_KEYLESS_SMOKE_SEARCH_KEY
