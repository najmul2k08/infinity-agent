# Standalone minimal SDK application. Unlike the ordinary SDK profile, this
# bundle does not layer over dsh-base: this insert is the complete Cordis tree.
# User profile, home, and invocation patches still apply above it.

- insert:
    - id: sdk-app-startup
      name: '@infinity-agent/sdk-app'
      config:
        profile: sdk-minimal

    - id: sdk-jsonrpc-server
      name: '@infinity-agent/sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: false

    - id: deepseek-llm-api-extensions
      name: '@infinity-agent/deepseek-llm-api-extensions'

    - id: session-log-deepseek
      name: '@infinity-agent/session-log-deepseek'

    - id: plugin-package-inventory-deepseek
      name: '@infinity-agent/plugin-package-inventory-deepseek'

    - id: llm-deepseek
      name: '@infinity-agent/llm-deepseek-api-key'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        defaultContextWindow: !!js Number(process.env.INFINITY_CONTEXT_WINDOW ?? 1000000)
        streamIdleTimeoutMs: 172800000

    - id: sandbox
      name: '@infinity-agent/sandbox-local'

    # Shared projection registry: sandbox-policy and terminal-bash fold
    # sandbox-mode state through its units and require it as a hard injection.
    - id: filesystem
      name: '@infinity-agent/fs-local'

    - id: attachment-local
      name: '@infinity-agent/attachment-local'

    - id: tool-fs
      name: '@infinity-agent/tool-fs'
      config:
        read: false
        readImage: true
        write: false
        edit: false

    - id: working-directory
      name: '@infinity-agent/working-directory'

    - id: tool-working-directory
      name: '@infinity-agent/tool-working-directory'

    - id: session-projection
      name: '@infinity-agent/session-projection'

    - id: token-meter
      name: '@infinity-agent/token-meter'

    - id: compaction-basic
      name: '@infinity-agent/compaction-basic'

    - id: image-offload
      name: '@infinity-agent/compaction-image-offload'

    - id: sandbox-policy
      name: '@infinity-agent/sandbox-policy'
      config:
        mode: danger-full-access
        workspaceRoot: !!js process.cwd()

    - id: subprocess
      name: '@infinity-agent/subprocess-local'

    - id: pty
      name: '@infinity-agent/terminal'

    - id: terminal-bash
      name: '@infinity-agent/terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: terminal-pwsh
      name: '@infinity-agent/terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    # Keep the minimal agent kernel explicit: unlike dsh-base, this profile
    # owns each service row and omits every optional producer it does not use.
    - id: timer
      name: '@infinity-agent/cordis-plugin-timer'

    - id: llm
      name: '@infinity-agent/llm'

    - id: session
      name: '@infinity-agent/session'

    - id: session-title
      name: '@infinity-agent/session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: system-prompt
      name: '@infinity-agent/system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        personaPrefix: !!js process.env.INFINITY_SYSTEM_PROMPT ?? 'You are a helpful software engineer assistant.'

    - id: tools
      name: '@infinity-agent/tools'

    - id: tool-executor-native
      name: '@infinity-agent/tool-executor-native'

    - id: mcp-resources
      name: '@infinity-agent/mcp-resources'

    - id: agent
      name: '@infinity-agent/agent'


    - id: llm-retry
      name: '@infinity-agent/llm-retry'

    - id: jobs
      name: '@infinity-agent/jobs-local'

    - id: agent-loop
      name: '@infinity-agent/agent-loop'
      config:
        agents: []

    - id: persistent-bash
      name: '@infinity-agent/tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * Network access depends on the task environment. Prefer configured mirrors/proxies when they are available.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

    - id: persistent-pwsh
      name: '@infinity-agent/tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a PowerShell shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * State is persistent across command calls and discussions with the user.
          * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.

    - id: sessions
      name: '@infinity-agent/session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')
        compression: none

    - id: session-checkpoint-policy
      name: '@infinity-agent/session-checkpoint-policy'
