- id: session-telemetry-otel
  disabled: true
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- insert:
    - id: product-telemetry-otel
      name: '@infinity-agent/host-product-telemetry-otel'
      config:
        endpoint: !!js process.env.INFINITY_PRODUCT_TELEMETRY_TEST_ENDPOINT
        serviceName: dsh-environment-test
        serviceVersion: synthetic-release
        compression: none
    - id: product-analytics
      name: '@infinity-agent/client-product-analytics'
      config:
        enabled: true
        appVersion: synthetic-release

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.INFINITY_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
