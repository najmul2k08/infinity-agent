# TypeScript SDK snapshot-record patch over `infinity --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@infinity-agent/skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@infinity-agent/llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@infinity-agent/session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js "process.env.INFINITY_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@infinity-agent/tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

# The process-local clock is deterministic; native timers remain live.
- insert:
    - id: snapshot-clock
      name: './clock.mjs'

- id: time-context
  config:
    timeZone: UTC

# The recorded tool catalog includes the optional patch tool.
- id: tool-fs
  config:
    applyPatch: true
