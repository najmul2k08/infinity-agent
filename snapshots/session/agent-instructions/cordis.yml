# Workspace-context snapshot patch: the harness exports INFINITY_HOME=<cwd>/.infinity-agent and
# INFINITY_AGENTS_HOME=<cwd>/.agents, so project-root and both user-global root
# discoveries stay inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@infinity-agent/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@infinity-agent/session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.INFINITY_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@infinity-agent/agent-instructions'
  config:
    maxBytes: 65536
    projectRootMarkers:
      - .infinity-agent-project

- id: system-prompt
  name: '@infinity-agent/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
